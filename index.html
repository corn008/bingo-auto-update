<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Bingo 歷史開獎結果</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-animation">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <header>
        <div class="header-container">
            <h1 class="glow-text">BINGO <span>BINGO</span></h1>
            <p class="subtitle">台灣彩券歷史開獎分析樞紐</p>

            <div class="controls">
                <input type="date" id="datePicker" class="neo-input" />
                <button id="loadBtn" class="neo-btn">載入數據</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="statsPanel" class="glass-panel stats-panel hidden">
            <!-- 統計數據可放此 -->
            <div class="stat-item">
                <span class="stat-label">當前載入期數</span>
                <span id="totalDraws" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">當前選擇日期</span>
                <span id="currentDateDisplay" class="stat-value">-</span>
            </div>
        </div>

        <!-- AI 預測看版 -->
        <div id="aiPanel" class="glass-panel ai-panel hidden">
            <h2 class="ai-title">🤖 AI 大數據趨勢分析與推演</h2>

            <div class="ai-stats-row">
                <div class="ai-stat-box hot">
                    <h3>🔥 熱門號碼 (出現最多次)</h3>
                    <div id="aiHotNums" class="ai-num-list"></div>
                </div>
                <div class="ai-stat-box cold">
                    <h3>❄️ 冷門號碼 (出現最少次)</h3>
                    <div id="aiColdNums" class="ai-num-list"></div>
                </div>
                <div class="ai-stat-box super">
                    <h3>⭐ 最常出超級獎號</h3>
                    <div id="aiSuperNums" class="ai-num-list"></div>
                </div>
            </div>

            <h3 class="strategy-title">💡 策略推演 (隨機產出 5 星)</h3>
            <div class="strategy-row">
                <div class="strategy-card">
                    <h4>策略一：追熱號 (絕對跟風)</h4>
                    <div id="stHot" class="balls-container small"></div>
                </div>
                <div class="strategy-card">
                    <h4>策略二：博冷門 (大反彈)</h4>
                    <div id="stCold" class="balls-container small"></div>
                </div>
                <div class="strategy-card">
                    <h4>策略三：3熱2冷 (穩健混搭)</h4>
                    <div id="stMix" class="balls-container small"></div>
                </div>
                <div class="strategy-card outline">
                    <h4>推薦超級獎號押注</h4>
                    <div id="stSuper" class="balls-container small"></div>
                </div>
                <p style="text-align:center; color: #888; font-size: 0.8rem; margin-top:20px;">(⚠️
                    提醒：彩券為隨機機率遊戲，此為基於今日數據做出的純統計推薦，請理性投注！)</p>

                <div
                    style="text-align: center; margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center;">
                    <label style="color: #fff; font-size: 0.95rem;">下注倍數：</label>
                    <select id="betMultiplier" class="neo-input"
                        style="width: 80px; padding: 5px; height: auto; text-align: center; color: #fff; background: rgba(0, 0, 0, 0.5);">
                        <option value="1">1 倍</option>
                        <option value="2">2 倍</option>
                        <option value="5">5 倍</option>
                        <option value="10">10 倍</option>
                        <option value="20">20 倍</option>
                        <option value="50">50 倍</option>
                    </select>
                    <button id="btnGen3Star" class="neo-btn"
                        style="background: linear-gradient(135deg, #f093fb, #f5576c); width: auto; padding: 10px 30px;">🎯
                        一鍵推演三星 (10組)</button>
                    <button id="btnClear3Star" class="neo-btn"
                        style="background: rgba(255, 255, 255, 0.1); width: auto; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.2);">🗑️
                        清空紀錄</button>
                </div>
                <div id="threeStarContainer" style="display: none; margin-top: 20px; text-align: center;">
                    <h3 class="strategy-title">🎯 三星精選 10 組推演</h3>
                    <div id="threeStarList" class="strategy-row"
                        style="flex-direction: column; gap: 10px; align-items: center;"></div>
                </div>
            </div>

            <!-- 卡片容器 -->
            <div id="resultsContainer" class="results-grid">
                <!-- Data will be injected here via JS -->
                <div class="loading-spinner" id="loading">讀取中...</div>
            </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
